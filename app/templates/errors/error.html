{% extends "base.html" if user else "plain.html" %}
{% import "_macros.html" as m with context %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">{{ code }}</div>
  <h1 style="margin-top:12px">{{ title }}</h1>
  <p class="muted" style="margin:10px 0 24px">{{ message }}</p>
  <div class="row" style="justify-content:center">
    <a class="btn" href="javascript:history.back()">{{ m.icon("arrow-left") }}Go back</a>
    <a class="btn btn-primary" href="/">{{ m.icon("layout-dashboard") }}Dashboard</a>
  </div>
</div>
{% endblock %}
