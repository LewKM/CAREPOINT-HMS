# CarePoint HMS - Docker Compose Development Configuration

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app:cached
    ports:
      - "${WEB_PORT:-8010}:${WEB_PORT:-8010}"   # same port inside and out, so the uvicorn log shows the real URL
    environment:
      - HTTPS_ONLY=false
      - RUN_MIGRATIONS=true   # same as scripts/dev.sh: always apply pending migrations
      - RUN_SEEDS=${RUN_SEEDS:-false}
      - SEED_DEMO=${SEED_DEMO:-true}
    env_file:
      - .env
    command: uvicorn app.main:app --reload --reload-dir app --host 0.0.0.0 --port ${WEB_PORT:-8010}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${WEB_PORT:-8010}/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
